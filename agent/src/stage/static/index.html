<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mise en Panic — stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Single-theme on purpose: this is projected in a dark room. */
  :root {
    --page:#0E1014; --panel:#171A21; --panel-2:#1E222B;
    --rule:#2B303A; --rule-soft:#22262F;
    --text:#ECEBE6; --text-mid:#A0A3AC; --text-faint:#6E717A;
    --masa:#E0AC46; --masa-dim:#403116;
    --replay:#8B9BF0; --replay-dim:#222741;
    --broken:#E8735C; --broken-dim:#3A201B;
    --healthy:#84C16A; --healthy-dim:#1E2C17;
    --display:'Archivo',system-ui,sans-serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--page);color:var(--text);
    font-family:var(--body);font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* ---------- top bar ---------- */
  header{
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:12px 22px;border-bottom:1px solid var(--rule);background:var(--panel);
  }
  .brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em}
  .brand span{color:var(--masa)}
  .wf{font-family:var(--mono);font-size:11.5px;color:var(--text-mid)}
  .spacer{flex:1}
  .pill{
    font-family:var(--mono);font-size:11px;letter-spacing:.05em;
    padding:4px 10px;border-radius:20px;white-space:nowrap;
    border:1px solid var(--rule);background:var(--panel-2);color:var(--text-mid);
  }
  .pill.on{color:var(--healthy);border-color:var(--healthy-dim);background:var(--healthy-dim)}
  .pill.run{color:var(--masa);border-color:var(--masa-dim);background:var(--masa-dim)}
  .pill.bad{color:var(--broken);border-color:var(--broken-dim);background:var(--broken-dim)}
  .pill.rep{color:var(--replay);border-color:var(--replay);background:var(--replay-dim)}

  /* ---------- two panes ---------- */
  main{flex:1;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:0}
  .pane{padding:16px 20px;min-height:0;display:flex;flex-direction:column}
  .pane.left{border-right:1px solid var(--rule)}
  .pane-h{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-faint);margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;
  }

  /* ---------- component cards ---------- */
  .cards{display:flex;flex-direction:column;gap:9px;overflow-y:auto;min-height:0}
  .card{
    background:var(--panel);border:1px solid var(--rule);
    border-left:3px solid var(--healthy);border-radius:5px;padding:10px 13px 11px;
  }
  .card.down{border-left-color:var(--broken);background:var(--broken-dim)}
  .card.active{box-shadow:0 0 0 1px var(--replay),0 0 26px -8px var(--replay)}
  .card-top{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
  .card-name{font-family:var(--display);font-weight:600;font-size:14.5px;letter-spacing:-.01em}
  .card-state{
    font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:1px 6px;border-radius:3px;
    color:var(--healthy);background:var(--healthy-dim);
  }
  .card.down .card-state{color:var(--broken);background:var(--broken-dim)}
  .card-taps{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-faint)}
  .card-src{
    font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:1px 5px;border-radius:3px;
    color:var(--text-faint);background:var(--panel-2);border:1px solid var(--rule);
  }
  .card-src.local{color:var(--replay);border-color:var(--replay-dim);background:var(--replay-dim)}

  /* tug-of-war bar: fixers from the left, breakers from the right */
  .tug{position:relative;height:9px;border-radius:5px;overflow:hidden;background:var(--broken)}
  .tug i{display:block;height:100%;background:var(--replay);transition:width .2s linear}
  .tug .mark{
    position:absolute;top:-3px;bottom:-3px;left:50%;width:2px;
    background:var(--text);opacity:.75;transform:translateX(-1px);
  }
  .tug-legend{
    display:flex;justify-content:space-between;margin-top:4px;
    font-family:var(--mono);font-size:10px;color:var(--text-faint);
  }
  .tug-legend b{font-weight:500;color:var(--text-mid)}
  /* boolean fallback, while the board still reports on/off */
  .binary{height:9px;border-radius:5px;background:var(--healthy)}
  .card.down .binary{background:var(--broken)}

  /* ---------- timeline ---------- */
  .tl{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column}
  .ev{
    display:grid;grid-template-columns:44px 13px minmax(0,1fr);gap:9px;
    padding:5px 0;border-bottom:1px solid var(--rule-soft);font-size:13px;align-items:baseline;
  }
  .ev:last-child{border-bottom:0}
  .ev .t{font-family:var(--mono);font-size:10px;color:var(--text-faint);font-variant-numeric:tabular-nums}
  .ev .g{font-family:var(--mono);font-size:11px;line-height:1}
  .ev .m em{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--text-faint)}
  .ev.ok .g{color:var(--healthy)}
  .ev.crash .g,.ev.crash .m{color:var(--broken)}
  .ev.recover .g,.ev.recover .m{color:var(--replay)}
  .ev.switch .g{color:var(--masa)}
  .ev.info .g{color:var(--text-faint)}

  /* ---------- scoreboard ---------- */
  .sb{margin-top:14px;border-top:1px solid var(--rule);padding-top:12px}
  .sb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule-soft);border-radius:5px;overflow:hidden}
  /* Fixed value height: an empty .v used to collapse and drag its label up,
     which reads as broken padding on one tile while the others look fine. */
  .sb-c{background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-start}
  .sb-c .v{
    font-family:var(--display);font-weight:700;font-size:25px;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;line-height:1.1;min-height:1.1em;
  }
  .sb-c .l{font-size:10.5px;color:var(--text-mid);line-height:1.3;margin-top:2px}
  .sb-c.rep .v{color:var(--replay)}
  .sb-c.good .v{color:var(--healthy)}
  .sb-c.hit .v{color:var(--broken)}
  .note{margin-top:9px;font-family:var(--mono);font-size:10px;color:var(--text-faint)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">MISE EN <span>PANIC</span></div>
  <div class="wf" id="wf"></div>
  <div class="spacer"></div>
  <div class="pill" id="pConns">board offline</div>
  <div class="pill" id="pArmed">—</div>
  <div class="pill" id="pStatus">idle</div>
</header>

<main>
  <section class="pane left">
    <div class="pane-h">
      <span>What the room has broken</span>
      <span id="boardErr"></span>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <section class="pane">
    <div class="pane-h"><span>What's happening in Temporal</span></div>
    <div class="tl" id="tl"></div>

    <div class="sb">
      <div class="sb-grid">
        <div class="sb-c good"><div class="v" id="mOrders">0</div><div class="l">orders completed</div></div>
        <div class="sb-c hit"><div class="v" id="mDeaths">0</div><div class="l">worker deaths survived</div></div>
        <div class="sb-c"><div class="v" id="mTurns">0</div><div class="l">model turns / <span id="mCalls">0</span> tool calls</div></div>
      </div>
      <div class="note" id="note">waiting for an order…</div>
    </div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const fmt = (n) => (n || 0).toLocaleString("en-US");

let lastSeq = -1;

function renderBoard(board, activeStep) {
  // When the board is unreachable we know nothing about phones or the floor.
  // Showing "0 phones / floor closed" there states two things as fact that we
  // have not actually observed.
  const conns = $("pConns");
  const armed = $("pArmed");
  if (!board.reachable) {
    conns.textContent = "board offline";
    conns.className = "pill bad";
    armed.textContent = "—";
    armed.className = "pill";
  } else {
    conns.textContent = board.conns + (board.conns === 1 ? " phone" : " phones");
    conns.className = "pill";
    armed.textContent = board.armed ? "floor open" : "floor closed";
    armed.className = "pill" + (board.armed ? " on" : "");
  }

  $("boardErr").textContent = board.error || (board.bus_healthy ? "" : "redis degraded");

  const host = $("cards");
  host.innerHTML = board.components.map((c) => {
    const down = !c.up;
    // Threshold mode: fixers push the blue bar right, breakers pull it left.
    // 50 is the tipping point, marked on the bar.
    const bar = (c.percent === null || c.percent === undefined)
      ? '<div class="binary"></div>'
      : `<div class="tug"><i style="width:${c.percent}%"></i><div class="mark"></div></div>
         <div class="tug-legend"><b>${c.percent}% fixers</b><span>tipping point 50</span><b>${100 - c.percent}% breakers</b></div>`;
    const isActive = activeStep && c.name.toLowerCase().replace(/[^a-z]/g, "")
                      .includes(activeStep.toLowerCase().replace(/[^a-z]/g, "").slice(0, 6));
    // "local" = read from our own chaos feed, because the board has no switch
    // for it yet. Worth saying on screen so nobody assumes the room can tap it.
    const src = c.source === "local"
      ? '<span class="card-src local">not on the board yet</span>'
      : (board.armed ? "" : '<span class="card-src">floor closed</span>');
    return `<div class="card ${down ? "down" : ""} ${isActive ? "active" : ""}">
      <div class="card-top">
        <span class="card-name">${c.name}</span>
        <span class="card-state">${down ? "DOWN" : "UP"}</span>
        ${src}
        <span class="card-taps">${c.taps ? c.taps + " taps" : ""}</span>
      </div>${bar}
    </div>`;
  }).join("") || `<div class="note">${
      board.error ? board.error : "no components to show — set STAGE_COMPONENTS=all to show Ian's switches"
    }</div>`;
}

function renderTimeline(events) {
  const glyph = { ok: "✓", crash: "✕", recover: "↺", switch: "⇅", info: "●" };
  const tl = $("tl");
  const atBottom = tl.scrollHeight - tl.scrollTop - tl.clientHeight < 50;
  tl.innerHTML = events.map((e) =>
    `<div class="ev ${e.kind}">
       <span class="t">${e.t.toFixed(1)}s</span>
       <span class="g">${glyph[e.kind] || "·"}</span>
       <span class="m">${e.message}${e.detail ? `<em>${e.detail}</em>` : ""}</span>
     </div>`).join("");
  if (atBottom) tl.scrollTop = tl.scrollHeight;
}

function render(s) {
  if (s.seq === lastSeq) return;
  lastSeq = s.seq;

  // Deliberately not the workflow id: several orders can be in flight at once,
  // so naming one of them misleads. The count is the honest version.
  const inFlight = s.orders_in_flight || 0;
  $("wf").textContent = inFlight
    ? `${inFlight} order${inFlight === 1 ? "" : "s"} in flight`
    : "";

  renderBoard(s.board, s.order && s.order.step);
  renderTimeline(s.timeline);

  const st = $("pStatus");
  const o = s.order || {};
  if (o.status === "worker down") { st.textContent = "worker down"; st.className = "pill bad"; }
  else if (o.finished) { st.textContent = "complete"; st.className = "pill on"; }
  else if (o.running) { st.textContent = o.step || o.status || "running"; st.className = "pill run"; }
  else { st.textContent = "idle"; st.className = "pill"; }

  // ?? 0 rather than the raw value: a missing key renders as an empty tile,
  // which looks like a layout bug rather than a count of zero. Zero is a real
  // and correct reading before the first order lands.
  const b = s.scoreboard || {};
  $("mOrders").textContent = b.orders_completed ?? 0;
  $("mDeaths").textContent = b.worker_deaths ?? 0;
  $("mTurns").textContent = b.turns ?? 0;
  $("mCalls").textContent = b.tool_calls ?? 0;

  // The detail line carries everything that isn't a headline tile. Numbers
  // only appear once they're non-zero, so it stays short until chaos starts.
  const parts = [`${fmt(b.tokens_spent)} tokens spent`, `${fmt(b.cache_read_tokens)} cached`];
  if (b.tokens_not_respent) parts.push(`${fmt(b.tokens_not_respent)} not re-spent`);
  if (b.calls_served_from_history) parts.push(`${b.calls_served_from_history} calls from history`);
  if (b.downstream_attempts) parts.push(`${fmt(b.downstream_attempts)}s of outage absorbed`);
  if (b.reissued_calls) parts.push(`${b.reissued_calls} re-issued call(s) attached, not duplicated`);
  if (o.tools_available && o.tools_available.length) {
    parts.push(`tools: ${o.tools_available.join(", ")}`);
  }
  $("note").textContent = parts.join(" · ");
}

// Full-state snapshots over SSE; a dropped frame self-corrects.
function connect() {
  const es = new EventSource("/api/stream");
  es.onmessage = (m) => { try { render(JSON.parse(m.data)); } catch (_) {} };
  es.onerror = () => { es.close(); setTimeout(connect, 1500); };
}
connect();
</script>
</body>
</html>
