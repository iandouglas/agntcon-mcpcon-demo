[project]
name = "richards-agent"
version = "0.1.0"
description = "Durable taco-ordering agent for the Chaos Engineered talk"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.8",
    "anthropic>=0.40",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/richards_agent", "src/fake_mcp", "src/stage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
